        <area shape="rect" coords="322,309,417,345" alt="火炬開發區" onclick="setDistrict('火炬開發區')">
        <area shape="rect" coords="36,232,97,262" alt="古鎮鎮" onclick="setDistrict('古鎮鎮')">
        <area shape="rect" coords="352,217,443,254" alt="民眾鎮" onclick="setDistrict('民眾鎮')">
        <area shape="rect" coords="237,314,303,338" alt="石岐區" onclick="setDistrict('石岐區')">
        <area shape="rect" coords="202,289,249,312" alt="西區" onclick="setDistrict('西區')">
        <area shape="rect" coords="155,350,231,383" alt="沙溪鎮" onclick="setDistrict('沙溪鎮')">
        <area shape="rect" coords="277,617,364,662" alt="坦洲鎮" onclick="setDistrict('坦洲鎮')">
        <area shape="rect" coords="151,242,223,276" alt="東升鎮" onclick="setDistrict('東升鎮')">
        <area shape="rect" coords="257,356,323,386" alt="東區" onclick="setDistrict('東區')">
        <area shape="rect" coords="122,151,185,178" alt="東鳳鎮" onclick="setDistrict('東鳳鎮')">
        <area shape="rect" coords="162,479,249,519" alt="板芙鎮" onclick="setDistrict('板芙鎮')">
        <area shape="rect" coords="204,176,273,207" alt="阜沙鎮" onclick="setDistrict('阜沙鎮')">
        <area shape="rect" coords="376,369,474,420" alt="南朗鎮" onclick="setDistrict('南朗鎮')">
        <area shape="rect" coords="204,395,262,435" alt="南區" onclick="setDistrict('南區')">
        <area shape="rect" coords="140,114,206,144" alt="南頭鎮" onclick="setDistrict('南頭鎮')">
        <area shape="rect" coords="216,577,285,609" alt="神灣鎮" onclick="setDistrict('神灣鎮')">
        <area shape="rect" coords="477,283,540,320" alt="馬鞍島" onclick="setDistrict('馬鞍島')">
        <area shape="rect" coords="245,248,322,284" alt="港口鎮" onclick="setDistrict('港口鎮')">
        <area shape="rect" coords="72,304,153,343" alt="橫欄鎮" onclick="setDistrict('橫欄鎮')">
        <area shape="rect" coords="291,150,367,193" alt="三角鎮" onclick="setDistrict('三角鎮')">
    </map>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
    <script>
        let allData = [], currentRenderedData = [], activeDetailItem = null;
        let filtersState = { district: '全部', categories: new Set(['全部']), price: '全部', myTag: '全部' };
        let userRecords = JSON.parse(localStorage.getItem('zsFoodMap_v1') || '{}');
        const CATEGORY_ICONS = { "粵菜": "🍚", "日式料理": "🍣", "海鮮酒樓": "🦞", "海鮮粥": "🍜", "粥麵小食": "🍜", "咖啡 Chill 地方": "☕", "農家菜": "🌿", "西式": "🍝", "順德菜": "🥘", "火鍋": "🍲" };
        const districtColors = { "東區": "#ef4444", "坦洲鎮": "#7a8f9a", "石岐區": "#f59e0b", "西區": "#3b82f6", "南區": "#10b981", "小欖鎮": "#8b5cf6", "全部": "#f97316" };

        async function fetchWeatherNews() {
            const container = document.getElementById('weather-badge-container');
            if (!container) return;
            try {
                const res = await fetch(`https://msbecky5354.github.io/JSON/data/zs_weather.json?v=${Date.now()}`); 
                if (res.ok) {
                    const data = await res.json();
                    let msg = data.zs_message || data.hk_message || data.message || ""; 
                    if (msg) {
                        container.innerHTML = `<div class="bg-blue-50/60 rounded-md border border-blue-100 px-2 flex items-center h-7 text-[12px] text-blue-800 shadow-sm"><i class="fa-solid fa-cloud-sun text-blue-500 mr-2"></i>${msg}</div>`;
                        container.classList.remove('opacity-0');
                    }
                }
            } catch (e) {}
        }

        async function fetchSpecialNews() {
            const container = document.getElementById('special-weather-container');
            if (!container) return;
            try {
                const res = await fetch(`https://msbecky5354.github.io/JSON/data/zs_special_weather.json?v=${Date.now()}`); 
                if (res.ok) {
                    const textData = await res.text();
                    if (textData.trim() !== "") {
                        const data = JSON.parse(textData);
                        let msg = data.zs_message || data.message || ""; 
                        if (msg) {
                            container.innerHTML = `<div class="bg-red-500 text-white text-[11px] px-2.5 py-1 rounded-xl font-bold flex items-center shadow-sm animate-pulse"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i>${msg}</div>`;
                            container.classList.remove('opacity-0');
                        }
                    }
                }
            } catch (e) {}
        }

        window.showToast = function(msg, dur = 3000) { 
            const t = document.getElementById("customToast"); 
            if(t) { 
                t.innerHTML = msg + `<div class='mt-4 text-center'><button onclick="document.getElementById('customToast').className=''" class='bg-white/20 px-6 py-2 rounded-full text-xs font-bold'>關閉</button></div>`; 
                t.className = "show"; 
                if(dur > 0) setTimeout(() => t.className = "", dur); 
            } 
        };

        window.copyToClipboard = function(text, successMsg = '✅ 已複製') {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => window.showToast(successMsg));
            } else {
                const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); window.showToast(successMsg); } catch(e) {}
                document.body.removeChild(ta);
            }
        };

        window.openQrModal = function() {
            document.getElementById('qrCodeImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(window.location.href)}`;
            document.getElementById('qrModalOverlay').style.display = 'flex';
        };
        window.closeQrModal = function() { document.getElementById('qrModalOverlay').style.display = 'none'; };
        window.copySiteUrl = function(evt) { evt.stopPropagation(); window.copyToClipboard(window.location.href, '✅ 網址已複製'); };

        window.openInfoModal = function(type) {
            const contents = {
                about: { title: "關於我們", body: "<p>「中山美食地圖」提供全面的中山飲食資訊。</p>" },
                privacy: { title: "隱私權政策", body: "<p>數據僅儲存於本地端。</p>" },
                terms: { title: "服務條款", body: "<p>資訊僅供參考。</p>" },
                contact: { title: "聯絡我們", body: "<p>歡迎加入群組交流。</p>" }
            };
            const c = contents[type];
            document.getElementById('infoModalTitle').innerText = c.title;
            document.getElementById('infoModalBody').innerHTML = c.body;
            document.getElementById('infoModalOverlay').style.display = 'flex';
        };
        window.closeInfoModal = function() { document.getElementById('infoModalOverlay').style.display = 'none'; };

        window.handleLiveSearch = function() { applyFilters(); };
        window.triggerSearch = function() { closeDetail(); applyFilters(); document.activeElement.blur(); jumpToResults(); };
        window.jumpToResults = function() { document.getElementById('filterMenu').classList.add('hidden'); window.scrollTo({ top: document.getElementById('resultsAnchor').offsetTop - 100, behavior: 'smooth' }); };
        
        window.setFilterState = function(t, v) { 
            if (t === 'category') {
                if (v === '全部') {
                    filtersState.categories = new Set(['全部']);
                } else {
                    filtersState.categories.delete('全部');
                    if (filtersState.categories.has(v)) {
                        filtersState.categories.delete(v);
                        if (filtersState.categories.size === 0) filtersState.categories.add('全部');
                    } else {
                        filtersState.categories.add(v);
                    }
                }
            } else if (t === 'myTag' || t === 'district' || t === 'price') {
                filtersState[t] = v;
            }
            updatePillUI(); 
            applyFilters(); 
        };

        window.setDistrict = function(d) { closeDetail(); filtersState.district = d; updatePillUI(); applyFilters(); jumpToResults(); };
        window.resetToHome = function() { closeDetail(); resetAllFilters(true); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        window.resetAllFilters = function(full) { 
            filtersState = { district: '全部', categories: new Set(['全部']), price: '全部', myTag: '全部' }; 
            document.getElementById('searchInput').value = ''; updatePillUI(); applyFilters(); 
            if(full) document.getElementById('filterMenu').classList.add('hidden');
        };

        window.toggleFilters = function() { document.getElementById('filterMenu').classList.toggle('hidden'); };
        window.showUserGuide = function() { window.showToast("點擊菜式按鈕可進行多選篩選！"); };
        window.showBookmarkGuide = function() { window.showToast("點擊餐廳詳情內的收藏或想去即可標記。"); };

        function getUserData(n) { return userRecords[n] || { visited: false, favorite: false, want: false, rating: 0, note: '' }; }
        function saveUserData(n, d) { userRecords[n] = d; localStorage.setItem('zsFoodMap_v1', JSON.stringify(userRecords)); }

        async function init() {
            try {
                fetchWeatherNews(); fetchSpecialNews();
                if (!window.allRestaurantData) throw new Error("數據未載入");
                
                allData = window.allRestaurantData.map((row, index) => { 
                    const getVal = (k) => (row[Object.keys(row).find(x => x.trim().toLowerCase() === k.toLowerCase())] || "").toString().trim();
                    return { 'Restaurant_Name': getVal('Restaurant_Name'), 'District': getVal('District'), 'Category': getVal('Category'), 'Avg_Cost': getVal('Avg_Cost'), 'Highlight': getVal('Highlight'), 'Address': getVal('Address'), 'Amap_URL': getVal('Amap_URL'), 'Status': getVal('status'), 'Youtube': getVal('Youtube'), '_index': index };
                }).filter(i => i.Restaurant_Name !== "" && i.Status.toUpperCase() !== "X");

                // 💡 修正 JavaScript 語法錯誤：改用 new Date().getFullYear()
                const now = new Date();
                document.getElementById('updateTime').innerText = `最後更新：${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
                
                buildFilterPills(allData); applyFilters();
                document.getElementById('loader').classList.add('hidden');
            } catch (e) { document.getElementById('loader').innerHTML = '<div class="text-gray-400">載入失敗。</div>'; }
        }

        function applyFilters() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            currentRenderedData = allData.filter(item => {
                const userData = getUserData(item.Restaurant_Name);
                const matchD = filtersState.district === '全部' || item.District === filtersState.district;
                const matchC = filtersState.categories.has('全部') || [...filtersState.categories].some(cat => item.Category && item.Category.includes(cat));
                const matchS = item.Restaurant_Name.toLowerCase().includes(term) || (item.Highlight && item.Highlight.toLowerCase().includes(term));
                const matchTag = filtersState.myTag === '全部' || userData[filtersState.myTag] === true;
                return matchD && matchC && matchS && matchTag;
            });
            renderData(currentRenderedData);
        }

        function renderData(data) {
            const container = document.getElementById('restaurantGrid'), header = document.getElementById('districtHeader');
            header.style.backgroundColor = districtColors[filtersState.district] || "#f97316";
            header.classList.remove('hidden');
            document.getElementById('districtTitle').innerText = filtersState.district === '全部' ? '所有地區' : filtersState.district;
            document.getElementById('districtCount').innerText = `共 ${data.length} 間`;
            if (data.length === 0) { container.innerHTML = `<div class="col-span-full p-20 text-center text-gray-400 bg-white">🍽️ 找不到結果。</div>`; return; }
            
            container.innerHTML = data.map((item, index) => {
                const userData = getUserData(item.Restaurant_Name);
                return `<div class="bg-white p-4 relative border-b border-gray-100 cursor-pointer" onclick="openDetail(${index})">
                    <div class="flex gap-4">
                        <div class="w-16 h-16 rounded-2xl bg-gray-50 flex items-center justify-center flex-shrink-0 text-3xl border border-gray-100">${CATEGORY_ICONS[item.Category] || '🍽️'}</div>
                        <div class="flex-1 min-w-0 pr-6">
                            <h3 class="text-[16px] font-bold text-gray-800 truncate">${item.Restaurant_Name}</h3>
                            <p class="text-[11px] text-gray-400 line-clamp-1 mt-0.5">${item.Highlight || '查看詳情'}</p>
                            <div class="flex justify-between items-center mt-2">
                                <span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-[10px] font-bold">${item.District}</span>
                                <span class="text-[11px] text-gray-400">人均 ¥${item.Avg_Cost || '--'}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        window.openDetail = function(idx) {
            const item = currentRenderedData[idx]; if(!item) return;
            activeDetailItem = item; const data = getUserData(item.Restaurant_Name);
            document.getElementById('detailName').innerText = item.Restaurant_Name;
            document.getElementById('detailDistrictBadge').innerText = item.District;
            document.getElementById('detailCategory').innerHTML = `<i class="fa-solid fa-utensils mr-1"></i>${item.Category || '美食'}`;
            document.getElementById('detailPrice').innerHTML = `<i class="fa-solid fa-sack-dollar text-[#d4b068] mr-1"></i>人均 ¥${item.Avg_Cost || '--'}`;
            document.getElementById('detailHighlight').innerText = item.Highlight || '暫無描述';
            document.getElementById('detailAddress').innerText = item.Address || `中山市${item.District}`;
            document.getElementById('mainContentView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo({ top: 0 });
        };
        window.closeDetail = function() { document.getElementById('detailView').classList.add('hidden'); document.getElementById('mainContentView').classList.remove('hidden'); };

        function buildFilterPills(data) {
            const dG = document.getElementById('filterGridDistrict'), cG = document.getElementById('filterGridCategory');
            dG.innerHTML = createPill('district', '全部', '全部') + [...new Set(data.map(i=>i.District))].map(d => createPill('district', d, d)).join('');
            
            const allCategories = [];
            data.forEach(i => { if (i.Category) i.Category.split('/').forEach(c => allCategories.push(c.trim())); });
            cG.innerHTML = createPill('category', '全部', '🍽️ 全部') + [...new Set(allCategories)].map(c => createPill('category', c, `${CATEGORY_ICONS[c] || '🍽️'} ${c}`)).join('');
            updatePillUI();
        }
        
        function createPill(t, v, l) { 
            return `<button onclick="setFilterState('${t}', '${v}')" data-type="${t}" data-value="${v}" class="filter-pill-${t} px-3 py-1.5 rounded-full text-[11px] border border-gray-200 bg-white shadow-sm mb-1 mr-1">${l}</button>`; 
        }
        
        function updatePillUI() { 
            document.querySelectorAll('.filter-pill-district').forEach(p => {
                const v = p.getAttribute('data-value');
                if (filtersState.district === v) p.className = "filter-pill-district px-3 py-1.5 rounded-full text-[11px] font-bold border border-[#f97316] text-white bg-[#f97316] shadow-sm mb-1 mr-1";
                else p.className = "filter-pill-district px-3 py-1.5 rounded-full text-[11px] border border-gray-200 text-gray-600 bg-white shadow-sm mb-1 mr-1";
            });
            document.querySelectorAll('.filter-pill-category').forEach(p => {
                const v = p.getAttribute('data-value');
                const isSelected = filtersState.categories.has(v);
                if (isSelected) p.className = "filter-pill-category px-3 py-1.5 rounded-full text-[11px] font-bold border border-[#f97316] text-white bg-[#f97316] shadow-sm mb-1 mr-1";
                else p.className = "filter-pill-category px-3 py-1.5 rounded-full text-[11px] border border-gray-200 text-gray-600 bg-white shadow-sm mb-1 mr-1";
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
