name: Sync Food Data from Google

on:
  workflow_dispatch: # 保持手動執行，可隨時手動點擊觸發同步

env:
  # 0 Hardcode 永久模板：由 GitHub Secrets 動態讀取 GAS API URL
  GAS_API_URL: ${{ secrets.GAS_API_URL }}
  # 🌟 新增：設定時區為香港時間，確保生成的 Timestamp 絕對準確
  TZ: 'Asia/Hong_Kong'

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Fetch and Format Data for data.js & Generate Timestamp
        run: |
          # 1. 寫入 JS 變數開頭
          echo -n "window.allRestaurantData = " > data.js
          
          # 2. 抓取 GAS 的 JSON 數據並追加寫入 data.js
          curl -L "${{ env.GAS_API_URL }}" >> data.js
          
          # 3. 寫入 JS 結尾分號
          echo ";" >> data.js
          
          # 🌟 4. 新增：獲取當前日期（格式：YYYY年M月D日）並寫入 txt 檔案
          date +"%Y年%-m月%-d日" > last_updated.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 使用 github.repository 動態綁定當前倉庫路徑，絕不寫死
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          
          # 🌟 修改：將 data.js 同 last_updated.txt 一齊加入追蹤名單
          git add data.js last_updated.txt
          
          # 檢查數據是否有變動，避免無意義 Commit
          if ! git diff --staged --quiet; then
            git commit -m "Auto-sync latest restaurant data & update timestamp"
            git push
          else
            echo "數據冇改變，無需更新"
          fi
