<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>VPN 通道、出口地點與測速檢測</title>
<style>
  :root{--gold:#b3924f;--ink:#2b2b2b;--muted:#8a8a8a}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
  body{background:#f6f1e7;color:var(--ink);padding:16px}
  .wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  h1{font-size:19px;line-height:1.4}
  h2{font-size:16px;margin-bottom:10px}
  .sub{color:var(--muted);font-size:12px;margin-top:4px}
  .banner{border-radius:16px;padding:16px;text-align:center;font-weight:700;font-size:17px}
  .banner span{display:block;font-weight:400;font-size:12.5px;margin-top:6px;line-height:1.5}
  .banner.idle{background:#eee;color:#666}
  .banner.ok{background:#e2f3e6;color:#2e7d43}
  .banner.warn{background:#fdf3d0;color:#8a6d1a}
  .label{font-size:12px;color:var(--muted)}
  .geo{font-size:18px;font-weight:700;margin-top:4px}
  .ip{font-size:12px;color:var(--muted);margin-top:4px}
  .sectionTitle{font-size:13px;font-weight:700;color:#555;display:flex;justify-content:space-between;align-items:center}
  .trow{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .tname{font-weight:700;font-size:15px}
  .turl{font-size:11px;color:var(--muted);word-break:break-all;margin-top:2px}
  .thint{font-size:11px;color:#9a7b1f;margin-top:4px}
  .pill{flex-shrink:0;font-size:12px;font-weight:700;border-radius:999px;padding:6px 10px;white-space:nowrap}
  .pill.idle{background:#eee;color:#777}
  .pill.ok{background:#e2f3e6;color:#2e7d43}
  .pill.bad{background:#fbe7e7;color:#c0392b}
  .pill.warn{background:#fdf3d0;color:#8a6d1a}
  .note{font-size:12px;color:#8a6d1a;background:#fdf3d0;border-radius:12px;padding:10px 12px;line-height:1.6;display:none}
  .row{display:flex;gap:12px;align-items:center}
  button.gold{background:var(--gold);color:#fff;border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer;flex:1}
  button.gold:disabled{opacity:.5}
  .auto{font-size:13px;display:flex;gap:6px;align-items:center;background:#fff;border-radius:14px;padding:12px}
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tab{flex:1;border:1px solid #ddd;background:#faf7f0;border-radius:10px;padding:9px;font-size:13px;cursor:pointer}
  .tab.on{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
  .result{margin-top:10px;font-size:14px;font-weight:700;text-align:center}
  a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><h1>VPN 通道、出口地點與測速檢測</h1><div class="sub" id="lastCheck">尚未檢測</div></div>

  <div class="banner idle" id="banner">尚未檢測<span>以出口地點與目標國家比對為準，避免直連誤判</span></div>

  <div class="card">
    <div class="label">目前出口地點</div>
    <div class="geo" id="exitGeo">查詢中...</div>
    <div class="ip" id="exitIp">-</div>
  </div>

  <div class="sectionTitle">目標節點回應參考（僅作延遲參考）<span id="probeSummary"></span></div>
  <div id="targets" style="display:flex;flex-direction:column;gap:10px"></div>
  <div class="note" id="probeNote"></div>

  <div class="row">
    <button class="gold" id="btnCheck">立即檢測</button>
    <label class="auto"><input type="checkbox" id="autoChk"> 每 10 秒自動測</label>
  </div>

  <div class="card">
    <h2>頻寬測速（Speedtest）</h2>
    <div class="tabs">
      <button class="tab on" data-r="out">境外 (Outside China)</button>
      <button class="tab" data-r="cn">中國境內 (China)</button>
    </div>
    <button class="gold" id="btnSpeed" style="width:100%">開始測速</button>
    <div class="sub" id="speedInfo"></div>
    <div id="speedNodes" style="display:flex;flex-direction:column;gap:10px;margin-top:10px"></div>
    <div class="result" id="speedResult">尚未執行測速</div>
    <div class="sub">測速以瀏覽器實際下載計算，僅供參考；中國境內節點若失敗，可改用 <a href="https://www.speedtest.cn/" target="_blank" rel="noopener">Speedtest.cn</a></div>
  </div>
</div>

<script>
/* ===== 設定 ===== */
const EXPECTED_CC = 'US';                 // 預期 VPN 出口國
const PROBE_TIMEOUT = 6000, IMG_TIMEOUT = 3500, EXIT_TIMEOUT = 6000;

const TARGETS = [
  {name:'YouTube',    url:'https://www.youtube.com/favicon.ico',              cnBlocked:true},
  {name:'Facebook',   url:'https://www.facebook.com/favicon.ico',             cnBlocked:true},
  {name:'TradingView',url:'https://www.tradingview.com/favicon.ico',          cnBlocked:true},
  {name:'Google',     url:'https://www.google.com/favicon.ico',               cnBlocked:true},
  {name:'懶人工具站', url:'https://lazytoolsstation.vercel.app/favicon.ico',  cnBlocked:true},
  {name:'百度（對照組）', url:'https://www.baidu.com/favicon.ico',            cnBlocked:false},
];

const EXIT_APIS = [
  {url:'https://ipwho.is/',      src:'ipwho.is', map:d=>({ip:d.ip,cc:d.country_code,country:d.country,region:d.region||d.city,ok:d.success!==false})},
  {url:'https://ipapi.co/json/', src:'ipapi.co', map:d=>({ip:d.ip,cc:d.country_code,country:d.country_name,region:d.region||d.city,ok:!d.error})},
  {url:'https://api.ip.sb/geoip',src:'ip.sb',    map:d=>({ip:d.ip,cc:d.country_code,country:d.country,region:d.region||d.city,ok:!!d.ip})},
];

const SPEED_NODES = {
  out:[{name:'Cloudflare Speed (1MB)',url:'https://speed.cloudflare.com/__down?bytes=1048576'},
       {name:'Cloudflare Speed (5MB)',url:'https://speed.cloudflare.com/__down?bytes=5242880'}],
  cn: [{name:'Staticfile CDN（約1MB）',url:'https://cdn.staticfile.org/echarts/5.4.3/echarts.min.js'},
       {name:'360 Baomitu CDN（約1MB）',url:'https://lib.baomitu.com/echarts/5.4.3/echarts.min.js'}]
};

/* ===== 工具 ===== */
const $ = id => document.getElementById(id);
const bust = u => u + (u.includes('?')?'&':'?') + '_vt=' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
function sig(ms){ const c=new AbortController(); setTimeout(()=>c.abort(),ms); return c.signal; }

/* ===== 出口查詢（不快取） ===== */
async function getExit(){
  for(const a of EXIT_APIS){
    try{
      const r = await fetch(a.url,{cache:'no-store',signal:sig(EXIT_TIMEOUT)});
      const d = a.map(await r.json());
      if(d.ok && d.cc) return {...d, src:a.src};
    }catch(e){}
  }
  return null;
}

/* ===== 節點探測：強制走網路 + 驗證真實圖示 ===== */
async function probe(t){
  const u = bust(t.url);                       // 修正1：唯一 URL，杜絕舊快取
  const t0 = performance.now();
  try{
    await fetch(u,{mode:'no-cors',cache:'reload',credentials:'include',
                   referrerPolicy:'no-referrer',signal:sig(PROBE_TIMEOUT)});
  }catch(e){
    return {state:'down', ms:Math.round(performance.now()-t0),
            reason:e.name==='AbortError'?'timeout':'blocked'};
  }
  const ms = Math.round(performance.now()-t0);
  const real = await verifyImage(u);           // 修正2：內容驗證，防污染/劫持假回應
  return {state: real?'up':'fake', ms};
}
function verifyImage(u){
  return new Promise(res=>{
    const img = new Image(); let done=false;
    const end = v => { if(!done){done=true;clearTimeout(tm);img.src='';res(v);} };
    const tm = setTimeout(()=>end(false), IMG_TIMEOUT);
    img.referrerPolicy='no-referrer';
    img.onload  = ()=>end(img.naturalWidth>0 && img.naturalHeight>0);
    img.onerror = ()=>end(false);
    img.src = u;
  });
}

/* ===== 判定：出口在 CN 時，被牆站點絕不顯示綠色 ===== */
function classify(t, r, exit){
  const inCN = exit && exit.cc==='CN';
  if(r.state==='down')
    return {cls:'bad', pill:r.reason==='timeout'?'無回應／逾時':'無回應',
            hint:(inCN&&t.cnBlocked)?'中國直連預期結果（被牆）':''};
  if(inCN && t.cnBlocked)                      // 修正3：地理交叉比對
    return {cls:'warn', pill:`可疑回應 · ${r.ms} ms`,
            hint:'出口在中國仍收到回應：疑似 DNS 污染／劫持，非真實可用'};
  if(r.state==='fake')
    return {cls:'warn', pill:`可疑回應 · ${r.ms} ms`, hint:'有回應但非正常圖示（可能被劫持）'};
  return {cls:'ok', pill:`有回應 · ${r.ms} ms`, hint:''};
}

/* ===== 畫面 ===== */
function buildTargets(){
  $('targets').innerHTML = TARGETS.map((t,i)=>`
    <div class="card">
      <div class="trow">
        <div><div class="tname">${t.name}</div><div class="turl">${t.url}</div></div>
        <span class="pill idle" id="pill${i}">尚未檢測</span>
      </div>
      <div class="thint" id="hint${i}"></div>
    </div>`).join('');
}
function setBanner(cls, main, sub){ $('banner').className='banner '+cls; $('banner').innerHTML=main+'<span>'+sub+'</span>'; }

let running=false;
async function runCheck(){
  if(running) return; running=true;
  $('btnCheck').disabled=true; $('btnCheck').textContent='檢測中...';
  setBanner('idle','檢測中...','正在查詢出口地點與節點回應');
  TARGETS.forEach((_,i)=>{ $('pill'+i).className='pill idle'; $('pill'+i).textContent='檢測中…'; $('hint'+i).textContent=''; });

  const exit = await getExit();
  if(exit){
    $('exitGeo').textContent = `${exit.country} (${exit.cc}) · ${exit.region||''}`;
    $('exitIp').textContent  = `IP: ${exit.ip} | 來源: ${exit.src}`;
    if(exit.cc===EXPECTED_CC)      setBanner('ok',  `符合目標 VPN（目前：${exit.cc}）`, `出口為 ${exit.country}，與預期一致`);
    else if(exit.cc==='CN')        setBanner('warn','未符合目標 VPN（目前：CN）',`預期出口為 ${EXPECTED_CC}，目前為 China（可能未開 VPN 或連錯地區）`);
    else                           setBanner('warn',`未符合目標 VPN（目前：${exit.cc}）`,`預期出口為 ${EXPECTED_CC}，目前為 ${exit.country}`);
  }else{
    $('exitGeo').textContent='無法判定'; $('exitIp').textContent='出口查詢 API 皆逾時';
    setBanner('idle','無法判定出口地點','請確認網路後重試；下方回應僅供參考');
  }

  const results = await Promise.all(TARGETS.map(t=>probe(t)));
  let okCount=0;
  results.forEach((r,i)=>{
    const c = classify(TARGETS[i], r, exit);
    if(c.cls==='ok') okCount++;
    $('pill'+i).className='pill '+c.cls; $('pill'+i).textContent=c.pill;
    $('hint'+i).textContent=c.hint;
  });
  $('probeSummary').textContent = `${okCount}/${TARGETS.length} 節點有回應`;

  const note=$('probeNote');
  if(exit && exit.cc==='CN'){
    note.style.display='block';
    note.textContent='目前出口在中國：境外站點理論上無法直連。已強制排除瀏覽器快取；若仍收到回應，會標為「可疑回應」（DNS 污染／劫持），不會判定為暢通。VPN 是否符合以出口地點為準。';
  }else if(!exit){ note.style.display='block'; note.textContent='出口未知：節點回應僅供參考，無法排除誤判。'; }
  else note.style.display='none';

  $('lastCheck').textContent='最後檢測：'+new Date().toLocaleTimeString('zh-TW',{hour12:false});
  $('btnCheck').disabled=false; $('btnCheck').textContent='立即檢測';
  running=false;
}

/* ===== 自動檢測 ===== */
let autoTimer=null;
$('autoChk').addEventListener('change',e=>{
  clearInterval(autoTimer);
  if(e.target.checked) autoTimer=setInterval(()=>{ if(!document.hidden) runCheck(); },10000);
});
$('btnCheck').addEventListener('click',runCheck);

/* ===== 測速 ===== */
let region='out', speedRunning=false;
function buildSpeedNodes(){
  $('speedNodes').innerHTML = SPEED_NODES[region].map((n,i)=>`
    <div class="card" style="box-shadow:none;border:1px solid #eee">
      <div class="trow">
        <div><div class="tname" style="font-size:14px">${n.name}</div><div class="turl">${n.url}</div></div>
        <span class="pill idle" id="sp${i}">待測速</span>
      </div>
    </div>`).join('');
  $('speedInfo').textContent=`目前區域：${region==='out'?'境外 (Outside China)':'中國境內 (China)'}（共 ${SPEED_NODES[region].length} 個測速節點）`;
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  if(speedRunning) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); region=b.dataset.r; buildSpeedNodes();
  $('speedResult').textContent='尚未執行測速';
}));
async function speedOne(n){
  const t0=performance.now(); let bytes=0;
  const r=await fetch(bust(n.url),{cache:'reload',referrerPolicy:'no-referrer',signal:sig(30000)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rd=r.body.getReader();
  for(;;){ const {done,value}=await rd.read(); if(done) break; bytes+=value.length; }
  const sec=(performance.now()-t0)/1000;
  return bytes*8/1e6/sec;
}
$('btnSpeed').addEventListener('click',async()=>{
  if(speedRunning) return; speedRunning=true;
  $('btnSpeed').disabled=true; $('btnSpeed').textContent='測速中...';
  $('speedResult').textContent='測速中...';
  const mbps=[];
  for(let i=0;i<SPEED_NODES[region].length;i++){
    $('sp'+i).className='pill idle'; $('sp'+i).textContent='測速中…';
    try{
      const m=await speedOne(SPEED_NODES[region][i]); mbps.push(m);
      $('sp'+i).className='pill ok'; $('sp'+i).textContent=`${m.toFixed(1)} Mbps`;
    }catch(e){
      $('sp'+i).className='pill bad'; $('sp'+i).textContent='失敗';
    }
  }
  $('speedResult').textContent = mbps.length
    ? `最快 ${Math.max(...mbps).toFixed(1)} Mbps（平均 ${(mbps.reduce((a,b)=>a+b,0)/mbps.length).toFixed(1)} Mbps）`
    : '全部節點測速失敗（可能未開 VPN 或 CORS 限制）';
  $('btnSpeed').disabled=false; $('btnSpeed').textContent='開始測速';
  speedRunning=false;
});

/* ===== 初始化 ===== */
buildTargets(); buildSpeedNodes(); runCheck();
</script>
</body>
</html>
